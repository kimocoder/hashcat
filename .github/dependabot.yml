# Dependabot version updates. The ecosystems named here are the ones this
# tree has manifests for: the workflows in .github/workflows and the Rust
# bindings under Rust/hashcat-sys.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/Rust/hashcat-sys"
    schedule:
      interval: "weekly"
